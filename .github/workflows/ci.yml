name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run harness
        run: |
          for f in scripts/verify/f0-*.sh; do
            "$f" || exit 1
          done
