# =============================================================================
# fkx — manifesto de infra local (015, item 0.8). TUDO desligado por padrao:
# `docker compose up <svc>` abre a sessao, `docker compose down` fecha.
# restart: "no" em tudo (ambiente sob demanda); portas so em 127.0.0.1.
# Segredos: .env local (nunca commitado) + secrets/ file-based. Molde no .env.example.
# Pins tag@digest congelados em specs/015-docker-compose/research.md.
# =============================================================================
name: fkx

services:
  # === NUCLEO (sem profile: sempre disponivel, nunca residente) ===
  postgres:
    image: postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    restart: "no"
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      # So para o init 01-users-dbs.sh (senhas dos usuarios de app; runtime usa _FILE/sockets)
      FKX_DB_PASSWORD: ${FKX_DB_PASSWORD:?fkx banco}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD:?langfuse banco}
      TZ: UTC
      PGTZ: UTC
    secrets:
      - pg_password
    volumes:
      - pgdata:/var/lib/postgresql
    tmpfs:
      - /tmp
      - /run/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512M
    mem_reservation: 256M
    cpus: "1.0"
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    read_only: true

  redis:
    image: redis:8.8.2-trixie@sha256:37227fff5638322f4ebea25d6d0dc3ee50848604e82b81426f11507b3ec7d2cc
    restart: "no"
    command: --appendonly yes --requirepass ${REDIS_AUTH:?redis auth} --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_AUTH:?redis auth}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256M
    mem_reservation: 128M
    cpus: "0.5"
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true

  # === PROFILE llm (Langfuse v4 + ClickHouse + MinIO) ===
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1@sha256:13582eff79c6605a2d315bdd0e70164142ea7e98fc8411e9e10d089502a6d883
    restart: "no"
    profiles: ["llm"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?minio root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?minio secreto}
    volumes:
      - miniodata:/data
    tmpfs:
      - /tmp
    networks:
      - backend
    mem_limit: 512M
    mem_reservation: 256M
    cpus: "0.5"
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true

  # One-shot: cria o bucket via mc (imagem com shell+mc; server e scratch).
  # Sem depends_on de proposito: retry limitado (30x2s) e falha alto e claro.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1@sha256:95b5f3f7969a5c5a9f3a700ba72d5c84172819e13385aaf916e237cf111ab868
    restart: "no"
    profiles: ["llm"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          mc alias set local http://minio:9000 "$${MINIO_ROOT_USER:?minio root}" "$${MINIO_ROOT_PASSWORD:?minio secreto}" >/dev/null 2>&1 \
          && mc mb --ignore-existing local/langfuse >/dev/null 2>&1 && exit 0
          sleep 2
        done
        exit 1
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?minio root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?minio secreto}
    tmpfs:
      - /tmp
    networks:
      - backend
    mem_limit: 64M
    mem_reservation: 32M
    cpus: "0.25"
    pids_limit: 50
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true

  clickhouse:
    image: clickhouse/clickhouse-server:25.12@sha256:8a790dd3468db22b1d4e7b18a176f378ff5ff6053b9c48dd4ea1fa71a24c5ba6
    restart: "no"
    profiles: ["llm"]
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?clickhouse secreto}
      TZ: UTC
    volumes:
      - clickhousedata:/var/lib/clickhouse
      - clickhouselogs:/var/log/clickhouse-server
    tmpfs:
      - /tmp
    networks:
      - backend
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1G
    mem_reservation: 512M
    cpus: "1.0"
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true

  langfuse-worker:
    image: langfuse/langfuse-worker:4.30.0@sha256:00bc13c8da68fb77c55bcba0c1c16377f1f360ffb17206dbc708912ce4e3afb5
    restart: "no"
    profiles: ["llm"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:?langfuse banco}@postgres:5432/langfuse
      SALT: ${SALT:?sal}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?chave 64hex}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?clickhouse secreto}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?minio root}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?minio secreto}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?minio root}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?minio secreto}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_AUTH:?redis auth}
    tmpfs:
      - /tmp
    networks:
      - backend
    mem_limit: 1G
    mem_reservation: 512M
    cpus: "1.0"
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true

  langfuse-web:
    image: langfuse/langfuse:4.30.0@sha256:376b96bdd8725e74171a3d0cdd9115c8265d4209df95cb26c47370cb3b32329a
    restart: "no"
    profiles: ["llm"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:?langfuse banco}@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?nextauth}
      SALT: ${SALT:?sal}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?chave 64hex}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?clickhouse secreto}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?minio root}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?minio secreto}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?minio root}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?minio secreto}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_AUTH:?redis auth}
    tmpfs:
      - /tmp
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/public/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    mem_limit: 1G
    mem_reservation: 512M
    cpus: "1.0"
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true

  # === PROFILE observability (LGTM + Pyroscope) ===
  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    restart: "no"
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    tmpfs:
      - /tmp
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512M
    mem_reservation: 256M
    cpus: "0.5"
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true

  loki:
    image: grafana/loki:3.7.7@sha256:d70e4659623f3e109af669cae76fe2a5dd5be54e2298fe8aed380d982fbc2500
    restart: "no"
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    tmpfs:
      - /tmp
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512M
    mem_reservation: 256M
    cpus: "0.5"
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true

  tempo:
    image: grafana/tempo:3.0.3@sha256:0296560ac66f8a3600d7fb3014a52c189d4d9c3549ad6ff441bf2409855d68d5
    restart: "no"
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    tmpfs:
      - /tmp
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3200/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512M
    mem_reservation: 256M
    cpus: "0.5"
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true

  pyroscope:
    image: grafana/pyroscope:2.3.0@sha256:881328cdbff0ef7601e23a0e7647fecb7099b4fe4c74fcdd204cb64722e2b2d0
    restart: "no"
    profiles: ["observability"]
    volumes:
      - pyroscopedata:/var/pyroscope
    tmpfs:
      - /tmp
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:4040/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512M
    mem_reservation: 256M
    cpus: "0.5"
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true

  alloy:
    image: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
    restart: "no"
    profiles: ["observability"]
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    command: ["run", "/etc/alloy/config.alloy", "--server.http.listen-addr=127.0.0.1:12345"]
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
    tmpfs:
      - /tmp
    networks:
      - backend
    mem_limit: 256M
    mem_reservation: 128M
    cpus: "0.5"
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true

  grafana:
    image: grafana/grafana:13.2.1@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
    restart: "no"
    profiles: ["observability"]
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      pyroscope:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?grafana admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    tmpfs:
      - /tmp
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 512M
    mem_reservation: 256M
    cpus: "0.5"
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true

networks:
  backend:
    driver: bridge
    internal: true

volumes:
  pgdata:
  redisdata:
  clickhousedata:
  clickhouselogs:
  miniodata:
  promdata:
  grafanadata:
  pyroscopedata:

secrets:
  pg_password:
    file: ./secrets/pg_password.txt
