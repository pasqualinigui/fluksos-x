[project]
name = "fkx-cli"
version = "0.1.0"
description = "Entry point fkx do motor fluksos-x: --help, --version"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fkx-core",
  "rich==15.0.0",
  "typer==0.27.2",
]

[project.scripts]
fkx = "fkx_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fkx_cli"]

[tool.uv.sources]
fkx-core = { workspace = true }
