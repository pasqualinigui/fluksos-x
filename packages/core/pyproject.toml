[project]
name = "fkx-core"
version = "0.1.0"
description = "Kernel do motor fluksos-x: config, estado, modelos, exceções"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fkx_core"]
