[project]
name = "fluksos-x"
version = "0.1.0"
description = "Motor determinístico multiagente — workspace root virtual"
requires-python = ">=3.12,<3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "python-semantic-release==10.6.2",
    "lefthook==2.1.12",
    "mypy==2.3.1",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.5",
]

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
markers = ["slow: marks tests as slow", "harness: oracle promotion tests"]
filterwarnings = ["error"]
xfail_strict = true
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["tests"]
parallel = false

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg", ".ipynb_checkpoints", ".mypy_cache", ".nox", ".pants.d", ".pyenv", ".pytest_cache", ".pytype", ".ruff_cache", ".svn", ".tox", ".venv", ".vscode", "__pypackages__", "_build", "buck-out", "build", "dist", "node_modules", "site-packages", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
extend-select = ["I", "UP", "B", "SIM", "S", "C4", "A", "RUF"]
ignore = ["E501", "S101", "S603"]
unfixable = []
[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "S603", "S607"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
exclude = "(?x)^(docs/|specs/|\\.venv/|\\.ruff_cache/|\\.mypy_cache/|\\.pytest_cache/)"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
warn_return_any = false

[tool.uv]
package = false
# ADR-034 / FR-017 — PYSEC-2026-2132 (CVE-2026-7246): python-semantic-release
# 10.6.2 declara `click<8.5.0,~=8.1.0`, que prende o click em 8.1.8. O piso 8.3.3
# e a primeira versao corrigida; o teto <8.5.0 preserva o limite que o proprio PSR
# declara. Mitigacao com condicao de saida: quando o PSR relaxar ~=8.1.0, a 014
# remove este override e o FR-017. Ver docs/plan/research/f0-013-click-cve.md.
override-dependencies = ["click>=8.3.3,<8.5.0"]

[tool.semantic_release]
allow_zero_version = true
major_on_zero = false
commit_parser = "conventional"
tag_format = "v{version}"
version_toml = [
    "pyproject.toml:project.version",
    "packages/core/pyproject.toml:project.version",
    "packages/cli/pyproject.toml:project.version",
]
